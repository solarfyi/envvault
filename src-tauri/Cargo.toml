[package]
name = "envvault-app"
version = "0.1.0"
edition = "2024"
description = "EnvVault desktop application"
license = "TBD"
build = "build.rs"

[[bin]]
name = "envvault-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
envvault = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
