[package]
name = "envvault"
version = "0.1.0"
edition = "2024"
description = "Secure local-first environment & credential management for developers"
license = "TBD"

[dependencies]
aead = "0.6.1"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
hex = "0.4.3"
rand = "0.10.3"
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
